<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <h1>Admin Panel</h1>
    <nav><a href="index.html">Back to Main</a></nav>
  </header>

  <div class="container">
    <div class="card" id="admin-login-card">
      <h2>Admin Login</h2>
      <form id="admin-login-form">
        <div class="form-group">
          <label>Admin Email</label>
          <input type="email" id="admin-email" value="wauyo.grant@gmail.com" required>
        </div>
        <div class="form-group">
          <label>PIN</label>
          <input type="password" id="admin-pin" value="1234567" required>
        </div>
        <button type="submit">Access Admin Panel</button>
      </form>
    </div>

    <div id="admin-panel" style="display: none;">
      <div class="card">
        <h2>Register New Matatu / Driver</h2>
        <form id="reg-matatu-form">
          <div class="form-group">
            <label>Registration Number (Plate)</label>
            <input type="text" id="m-reg" placeholder="KDA 123X" required>
          </div>
          <div class="form-group">
            <label>Owner Name</label>
            <input type="text" id="m-owner" required>
          </div>
          <div class="form-group">
            <label>Driver Name</label>
            <input type="text" id="m-driver" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="m-email" required>
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input type="text" id="m-phone" required>
          </div>
          <div class="form-group">
            <label>Default PIN</label>
            <input type="text" id="m-pin" value="1234" required>
          </div>
          <button type="submit">Register Matatu</button>
        </form>
      </div>

      <div class="card">
        <h2>Registered Matatus</h2>
        <div id="matatu-list">Loading...</div>
      </div>

      <div class="card">
        <h2>All Bookings</h2>
        <div id="bookings-list">Loading...</div>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
