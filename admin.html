<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard Control</title>
  <link rel="stylesheet" href="admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <div class="header-container">
      <h1>Admin Control Panel</h1>
      <nav><a href="index.html">Main Site</a></nav>
    </div>
  </header>

  <div class="container">
    <div class="card" id="admin-login-card">
      <h2>Admin Authentication</h2>
      <form id="admin-login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="a-email" value="wauyo.grant@gmail.com" required>
        </div>
        <div class="form-group">
          <label>PIN</label>
          <input type="password" id="a-pin" value="1234567" required>
        </div>
        <button type="submit">Login as Admin</button>
      </form>
    </div>

    <div id="admin-dash" style="display: none;">
      <div class="card">
        <h2>Register Bus / Driver</h2>
        <form id="reg-bus-form">
          <div class="form-group">
            <label>Registration Number (Plate)</label>
            <input type="text" id="b-reg" placeholder="KDA 123X" required>
          </div>
          <div class="form-group">
            <label>Owner Name</label>
            <input type="text" id="b-owner" placeholder="Owner Full Name" required>
          </div>
          <div class="form-group">
            <label>Driver Name</label>
            <input type="text" id="b-driver" placeholder="Driver Full Name" required>
          </div>
          <div class="form-group">
            <label>Driver/Owner Email</label>
            <input type="email" id="b-email" required>
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="text" id="b-phone" required>
          </div>
          <div class="form-group">
            <label>Initial Login PIN</label>
            <input type="text" id="b-pin" value="1234" required>
          </div>
          <button type="submit">Register Bus & Driver</button>
        </form>
      </div>

      <div class="card">
        <h2>All Registered Vehicles & Drivers</h2>
        <div class="table-responsive" id="bus-table-container">Loading...</div>
      </div>

      <div class="card">
        <h2>System Routes Management</h2>
        <div class="table-responsive" id="routes-table-container">Loading...</div>
      </div>

      <div class="card">
        <h2>Customer Bookings Overview</h2>
        <div class="table-responsive" id="bookings-table-container">Loading...</div>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
