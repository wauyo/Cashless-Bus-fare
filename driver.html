<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver / Owner Portal</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <div class="header-container">
      <h1>Driver & Owner Portal</h1>
      <nav><a href="index.html">Customer View</a></nav>
    </div>
  </header>

  <div class="container">
    <div class="card" id="login-card">
      <h2>Driver Login</h2>
      <form id="driver-login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="d-email" required>
        </div>
        <div class="form-group">
          <label>PIN</label>
          <input type="password" id="d-pin" required>
        </div>
        <button type="submit">Login</button>
      </form>
    </div>

    <div id="driver-dash" style="display: none;">
      <div class="card">
        <h2>Driver Profile Credentials</h2>
        <form id="driver-profile-form">
          <div class="form-group">
            <label>Driver Name</label>
            <input type="text" id="p-name" required>
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="text" id="p-phone" required>
          </div>
          <div class="form-group">
            <label>Update PIN</label>
            <input type="password" id="p-pin" required>
          </div>
          <button type="submit">Update Details</button>
        </form>
      </div>

      <div class="card">
        <h2>Publish New Route</h2>
        <form id="add-route-form">
          <div class="form-group">
            <label>Origin</label>
            <input type="text" id="r-origin" placeholder="e.g. Voi" required>
          </div>
          <div class="form-group">
            <label>Destination</label>
            <input type="text" id="r-dest" placeholder="e.g. Mombasa" required>
          </div>
          <div class="form-group">
            <label>Departure Time</label>
            <input type="datetime-local" id="r-time" required>
          </div>
          <div class="form-group">
            <label>Fare (KES)</label>
            <input type="number" id="r-fare" required>
          </div>
          <div class="form-group">
            <label>Seats Available</label>
            <input type="number" id="r-seats" value="14" required>
          </div>
          <button type="submit">Publish Route</button>
        </form>
      </div>
    </div>
  </div>

  <script src="driver.js"></script>
</body>
</html>
