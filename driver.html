<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver / Owner Portal</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <h1>Matatu Portal - Driver / Owner</h1>
    <nav><a href="index.html">Customer View</a></nav>
  </header>

  <div class="container">
    <div class="card" id="login-card">
      <h2>Driver Login</h2>
      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="driver-email" required>
        </div>
        <div class="form-group">
          <label>PIN</label>
          <input type="password" id="driver-pin" required>
        </div>
        <button type="submit">Login</button>
      </form>
    </div>

    <div id="driver-dashboard" style="display: none;">
      <div class="card">
        <h2>Update Credentials / Details</h2>
        <form id="update-profile-form">
          <div class="form-group">
            <label>Driver Name</label>
            <input type="text" id="prof-driver-name" required>
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="text" id="prof-phone" required>
          </div>
          <div class="form-group">
            <label>Update PIN</label>
            <input type="password" id="prof-pin" required>
          </div>
          <button type="submit">Update Profile</button>
        </form>
      </div>

      <div class="card">
        <h2>Add New Route</h2>
        <form id="add-route-form">
          <div class="form-group">
            <label>Origin</label>
            <input type="text" id="route-origin" required placeholder="e.g. Voi">
          </div>
          <div class="form-group">
            <label>Destination</label>
            <input type="text" id="route-dest" required placeholder="e.g. Mombasa">
          </div>
          <div class="form-group">
            <label>Departure Time</label>
            <input type="datetime-local" id="route-time" required>
          </div>
          <div class="form-group">
            <label>Fare (KES)</label>
            <input type="number" id="route-fare" required>
          </div>
          <div class="form-group">
            <label>Available Seats</label>
            <input type="number" id="route-seats" value="14" required>
          </div>
          <button type="submit">Post Route</button>
        </form>
      </div>
    </div>
  </div>

  <script src="driver.js"></script>
</body>
</html>
