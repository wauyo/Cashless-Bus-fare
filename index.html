<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matatu & Bus Online Booking</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://js.paystack.co/v2/inline.js"></script>
</head>
<body>
  <header>
    <div class="header-container">
      <h1>Matatu Booking Service</h1>
      <nav>
        <a href="driver.html">Driver Portal</a>
        <a href="admin.html">Admin</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <h2>Available Routes</h2>
      <div id="routes-list">Loading routes...</div>
    </div>

    <div class="card" id="booking-card" style="display: none;">
      <h2>Complete Booking</h2>
      <form id="booking-form">
        <div class="form-group">
          <label for="cust-name">Full Name</label>
          <input type="text" id="cust-name" placeholder="John Doe" required>
        </div>

        <div class="form-group">
          <label for="cust-email">Email Address</label>
          <input type="email" id="cust-email" placeholder="john@example.com" required>
        </div>

        <div class="form-group">
          <label for="cust-phone">Phone Number (M-Pesa)</label>
          <input type="tel" id="cust-phone" placeholder="0712345678" required>
        </div>

        <div class="form-group">
          <label for="seats">Number of Seats</label>
          <input type="number" id="seats" min="1" value="1" required>
        </div>

        <p style="margin-top: 0.5rem;"><strong>Total Fare:</strong> KES <span id="total-fare">0</span></p>

        <button type="submit" id="pay-btn">Pay with Paystack (M-Pesa)</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
